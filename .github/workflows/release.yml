# Cutting a release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Four jobs build the same commit on Windows, macOS (both architectures) and Linux,
# and upload the installers to one GitHub release. The release is created as a
# DRAFT and flagged as a PRE-RELEASE: nothing is public, and nothing is advertised
# as "latest", until somebody has installed one of these and confirmed it runs.
#
# This costs nothing. Standard GitHub-hosted runners are free in public
# repositories, which is the main reason this repository is public. No certificates
# are involved either: macOS is ad-hoc signed through `bundle.macOS.signingIdentity`
# in tauri.conf.json, because a real signature needs a paid Apple account, and
# Windows is unsigned, so SmartScreen warns. The release notes below say both of
# those out loud rather than leaving them to surprise somebody.
#
# Versioning: `app/src-tauri/tauri.conf.json` is the single source of truth.
# `__VERSION__` is substituted by tauri-action from that value, so the tag and the
# binaries cannot disagree - and the `check` job stops the run if a pushed tag
# disagrees anyway.
#
# The stage is pre-alpha, and the version stays a plain 0.1.0. The stage is carried
# by the release title and by the pre-release flag rather than by the version
# string, because WiX (the MSI bundler) is fussy about pre-release identifiers in a
# version. If a "0.1.0-alpha.1" string is wanted later, bundle.windows.wix.version
# is there to keep the MSI numeric while the app version is not.
#
# Action versions below are taken from the Tauri documentation's own workflow
# example (v2.tauri.app/distribute/pipelines/github). Check that page before
# bumping them by hand.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: tag and app version agree
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: compare the tag with tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match app version v$version in app/src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "tag and app version agree on v$version"

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing should not cancel the others: a Windows-only problem
      # should still produce the Linux and macOS artifacts.
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: ''
            args: ''
          - name: macOS ARM
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            target: ''
            args: ''
    steps:
      - uses: actions/checkout@v7

      # The Tauri Linux prerequisites, verbatim from the Tauri prerequisites page.
      # libxdo-dev is the one that is easy to leave out.
      - name: install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Separate from the toolchain step so that the two jobs which need no extra
      # target do not pass it an empty list.
      - name: add the macOS target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # The workspace root, which is where Cargo.lock and target/ live. The
          # Tauri app is a member of it rather than a workspace of its own.
          workspaces: .

      - name: install frontend dependencies
        working-directory: app
        run: npm ci

      - name: build, and attach to a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The app is not at the root of the repository, so the action has to be
          # told where it is or it will use a global CLI instead of this project's.
          projectPath: app
          tagName: v__VERSION__
          releaseName: Meterix __VERSION__ (pre-alpha)
          releaseBody: |
            Meterix __VERSION__, pre-alpha.

            Early. It runs, and it is worth having if you already pay several
            providers, but it has not been through anyone else's hands yet. The
            provider list, the database location and the settings screen can all
            still change between builds.

            Windows: the installer is not code signed yet, so Windows shows
            "Windows protected your PC". Choose More info, then Run anyway.

            macOS: ad-hoc signed, not notarised. If macOS will not open it, go to
            System Settings, then Privacy & Security, and choose Open Anyway.
            Apple Silicon builds should not be reported as damaged.

            Linux: chmod +x the AppImage and run it, or install the .deb with
            apt install ./Meterix_*.deb

            It reads balances. It sends nothing anywhere except the provider you
            configured, and your keys stay in the operating system keychain.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
