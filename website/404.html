<!doctype html>
<!--
  The 404 page. Workers serves this with a real 404 status for any path that is
  not an asset, which is what `not_found_handling: "404-page"` in wrangler.jsonc
  turns on. Without it, an unmatched path would get a 404 with no body.

  Everything here is root-absolute: this file is served at whatever URL was asked
  for, so `fonts/x.woff2` would resolve against that path and 404 its own fonts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - Meterix</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#131312" />
    <meta name="color-scheme" content="dark" />
    <style>
      @font-face {
        font-family: 'Space Grotesk Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 300 700;
        src: url('/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Geist Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/geist-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Geist Mono Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/geist-mono-latin-wght-normal.woff2') format('woff2-variations');
      }

      :root {
        --font-display: 'Space Grotesk Variable', ui-sans-serif, system-ui, sans-serif;
        --font-sans: 'Geist Variable', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'Geist Mono Variable', ui-monospace, monospace;
        --backdrop: #131312;
        --line: #2e2e2c;
        --line-strong: #3a3a37;
        --ink: #e9e7e2;
        --ink-dim: #a8a69e;
        --ink-muted: #7a7871;
        --amber: #e0a64b;
        --teal: #4db6ac;
        --r-control: 10px;
      }

      * { box-sizing: border-box; }

      html { height: 100%; -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--backdrop);
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      ::selection { background: #6a5220; }

      main { max-width: 520px; }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: var(--font-display);
        font-size: 15px;
        color: var(--ink-dim);
      }

      h1 {
        margin: 28px 0 0;
        font-family: var(--font-display);
        font-weight: 500;
        font-size: clamp(26px, 4.4vw, 38px);
        line-height: 1.12;
        letter-spacing: -0.02em;
      }

      p {
        margin: 16px 0 0;
        color: var(--ink-dim);
        max-width: 46ch;
      }

      .code {
        display: inline-block;
        margin-top: 22px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #1a1a19;
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--ink-muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
        margin-top: 26px;
      }

      a { color: inherit; text-decoration: none; }

      :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 4px; }

      .btn {
        display: inline-flex;
        align-items: center;
        height: 42px;
        padding: 0 20px;
        border-radius: var(--r-control);
        background: var(--amber);
        color: #201a0d;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .btn:hover { background: #eab558; }
      .btn:active { transform: translateY(1px); }

      .link {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--ink-dim);
        border-bottom: 1px solid var(--line-strong);
        padding-bottom: 2px;
      }

      .link:hover { color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">
        <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true">
          <rect x="1" y="3" width="18" height="3.4" rx="1" fill="#4DB6AC" />
          <rect x="3.8" y="8.3" width="12.4" height="3.4" rx="1" fill="#4DB6AC" />
          <rect x="6.8" y="13.6" width="6.4" height="3.4" rx="1" fill="#4DB6AC" />
        </svg>
        Meterix
      </span>

      <h1>There is no page at this address.</h1>

      <p>
        Meterix is a single page, so there is not much to miss. The home page has the
        four providers, how a balance is read, what leaves your machine, and how to
        build it.
      </p>

      <p class="code" id="where">requested: <span></span></p>

      <div class="actions">
        <a class="btn" href="/">Go to the home page</a>
        <a class="link" href="/#limits">Read the limits</a>
      </div>
    </main>

    <script>
      /* Show what was asked for. Text, not HTML, so a path in the URL cannot put
         anything into the page. */
      document.querySelector('#where span').textContent = location.pathname;
    </script>
  </body>
</html>
