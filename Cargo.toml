[package]
name = "meterix-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
keyring = "3"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
serde_json = "1"
