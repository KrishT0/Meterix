# The whole project in one workspace: the core library with its CLI, and the
# desktop app. Each used to be its own workspace root, which meant the lockfile
# and the profile section had to be kept in step in two places and the two
# dependency trees were compiled twice, into two target directories.
#
# `[profile]` and `[patch]` are only read from the root manifest, so anything
# shared between members belongs here rather than in a member's own file.
[workspace]
resolver = "3"
members = ["crates/meterix-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Versions used by more than one member. A crate only one member needs is
# declared there, where its features are the only ones that matter.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1" }

# Incremental compilation is what makes `target/` grow by gigabytes: every editing
# session appends another cache beside the ones before it. It is off so the folder
# stops growing, at the cost of recompiling this project's own crates after each
# edit rather than reusing the previous session. The compiled dependency tree in
# `target/debug/deps` is untouched — only the per-session reuse is given up.
[profile.dev]
incremental = false
